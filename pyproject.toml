[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudgraph"
version = "0.1.0"
description = "Graph-Based Fraud & Abuse Ring Detection System"
authors = [{ name = "Razorpay AI Builder Track", email = "candidate@example.com" }]
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = "."
addopts = "-v --tb=short"

